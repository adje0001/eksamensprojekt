services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: chatapp
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodata:
